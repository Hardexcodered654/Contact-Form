<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frontend Mentor | Contact form</title>
  <link rel="stylesheet" href="form.css">
</head>
<body>
<main class="card">
  <h2 class="head">Contact Us</h2>

<div class="form">
    <div class="form-group">
  <label for="firstname">First Name <span class="required">*</span></label>
  <input type="text" id="firstname" name="firstname" required>
  </div>

  <div class="form-group">
  <label for="lastname">Last Name <span class="required">*</span></label>
  <input type="text" id="lastname" name="lastname" required>
  </div>
</div>

  <div class="form-email">
  <label for="email">Email Address <span class="required">*</span></label>
  <input type="text" id="email" name="email" required>
  </div>

  <fieldset class="query-type">
    <legend>Query Type <span class="required">*</span></legend>

      <div class="radio-group">
        <label class="radio-box">
          <input type="radio" name="query-type" value="general" required>
          <span>General Enquiry</span>
        </label>

        <label class="radio-box">
          <input type="radio" name="query-type" value="support" required>
          <span>Support Request</span>
        </label>
      </div>
  </fieldset>

  <div class="form-message">
    <label for="message">Message <span class="required">*</span></label>
    <textarea name="message" id="message" name="message" rows="5" required></textarea>
  </div>
    
  <div class="consent">
  <input type="checkbox" id="consent" name="consent" required>
  <label for="consent">I consent to being contacted by the team<span class="required">*</span></label>
  </div>
  <button type="submit" class="submit-btn">Submit</button>
  <footer class="attribution">
    <p>Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.<br>
      Coded by <a href="#">Hardex</a>.</p>
  </footer>
  </main>
</body>
</html>
